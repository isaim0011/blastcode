<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="brandBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="440" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    
    <line x1="160" y1="0" x2="160" y2="440" />
    <line x1="320" y1="0" x2="320" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="640" y1="0" x2="640" y2="440" />
    <line x1="800" y1="0" x2="800" y2="440" />
    <line x1="960" y1="0" x2="960" y2="440" />
    <line x1="1120" y1="0" x2="1120" y2="440" />
  </g>

  <!-- Left: Stylized Icon Badge (Center at x=190, y=220) -->
  <g transform="translate(60, 80) scale(0.55)">
    <!-- Hexagonal Plate -->
    <polygon points="256,44 426,142 426,370 256,468 86,370 86,142" 
             fill="#0f172a" 
             stroke="#00f0ff" 
             stroke-width="4" 
             filter="url(#glowBanner)"/>

    <!-- Network Lines -->
    <g stroke="#0284c7" stroke-width="3" opacity="0.65">
      <line x1="130" y1="180" x2="190" y2="130" />
      <line x1="130" y1="180" x2="140" y2="280" />
      <line x1="140" y1="280" x2="190" y2="350" />
      <line x1="190" y1="350" x2="256" y2="400" />
      <line x1="382" y1="180" x2="322" y2="130" />
      <line x1="382" y1="180" x2="372" y2="280" />
      <line x1="372" y1="280" x2="322" y2="350" />
      <line x1="322" y1="350" x2="256" y2="400" />
    </g>

    <!-- Nodes -->
    <circle cx="256" cy="105" r="9" fill="#00f0ff" filter="url(#glowBanner)"/>
    <circle cx="130" cy="180" r="10" fill="#00f0ff" filter="url(#glowBanner)"/>
    <circle cx="382" cy="180" r="10" fill="#00f0ff" filter="url(#glowBanner)"/>
    <circle cx="256" cy="400" r="12" fill="#f59e0b" filter="url(#glowBanner)"/>

    <!-- Lightning Bolt -->
    <polygon points="280,72 166,246 250,246 220,436 346,238 268,238" 
             fill="url(#brandBolt)" 
             stroke="#ffffff" 
             stroke-width="3" 
             filter="url(#glowBanner)"/>
  </g>

  <!-- Right: Typography & Brand Narrative -->
  <g transform="translate(380, 0)">
    <!-- Primary Title -->
    <text x="0" y="170" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="900" 
          font-size="82" 
          letter-spacing="-1"
          fill="url(#textGrad)">
      BlastCode
    </text>

    <!-- Tagline / Subtitle -->
    <text x="0" y="225" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="600" 
          font-size="28" 
          fill="#38bdf8" 
          letter-spacing="0.5">
      Incremental Code-Graph &amp; Blast-Radius Engine
    </text>

    <!-- Value Proposition -->
    <text x="0" y="275" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="400" 
          font-size="20" 
          fill="#94a3b8">
      Know what breaks before your AI agent edits · 90%+ Token Reduction · 10 Languages
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1: MCP Server -->
      <rect x="0" y="0" width="140" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="70" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">MCP SERVER</text>

      <!-- Pill 2: 10 Languages -->
      <rect x="155" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="237" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">10 LANGUAGES</text>

      <!-- Pill 3: Blast Radius -->
      <rect x="335" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="420" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">BLAST RADIUS</text>

      <!-- Pill 4: Sub-Second -->
      <rect x="520" y="0" width="155" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <text x="597" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#c084fc" text-anchor="middle">SUB-SECOND</text>
    </g>
  </g>
</svg>
