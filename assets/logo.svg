<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Bolt Electric Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="hexInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container / Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Code Graph Background Constellation Grid -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="none"/>
    <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="256" cy="256" r="80" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
  </g>

  <!-- Outer Hexagonal Frame -->
  <polygon points="256,44 426,142 426,370 256,468 86,370 86,142" 
           fill="url(#hexInner)" 
           stroke="#00f0ff" 
           stroke-width="3" 
           stroke-opacity="0.4"
           filter="url(#glow)"/>

  <polygon points="256,58 412,148 412,364 256,454 100,364 100,148" 
           fill="none" 
           stroke="#3b82f6" 
           stroke-width="1.5" 
           stroke-opacity="0.3"/>

  <!-- Code Graph Directed Edges & Networks -->
  <g stroke="#0284c7" stroke-width="2.5" opacity="0.6">
    <!-- Left Branch -->
    <line x1="130" y1="180" x2="190" y2="130" />
    <line x1="130" y1="180" x2="140" y2="280" />
    <line x1="140" y1="280" x2="190" y2="350" />
    <line x1="190" y1="350" x2="256" y2="400" />
    
    <!-- Right Branch -->
    <line x1="382" y1="180" x2="322" y2="130" />
    <line x1="382" y1="180" x2="372" y2="280" />
    <line x1="372" y1="280" x2="322" y2="350" />
    <line x1="322" y1="350" x2="256" y2="400" />

    <!-- Cross Connectors -->
    <line x1="190" y1="130" x2="256" y2="105" />
    <line x1="322" y1="130" x2="256" y2="105" />
  </g>

  <!-- Accent Energy Lines -->
  <g stroke="#f59e0b" stroke-width="1.8" opacity="0.75">
    <line x1="190" y1="130" x2="230" y2="220" />
    <line x1="322" y1="350" x2="280" y2="280" />
    <line x1="140" y1="280" x2="210" y2="270" />
    <line x1="372" y1="280" x2="300" y2="240" />
  </g>

  <!-- Graph Nodes (AST Symbols) -->
  <!-- Cyan/Blue Nodes -->
  <circle cx="256" cy="105" r="7" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="190" cy="130" r="6" fill="#38bdf8"/>
  <circle cx="322" cy="130" r="6" fill="#38bdf8"/>
  <circle cx="130" cy="180" r="8" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="382" cy="180" r="8" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="140" cy="280" r="6" fill="#38bdf8"/>
  <circle cx="372" cy="280" r="6" fill="#38bdf8"/>
  
  <!-- Amber/Blast Nodes -->
  <circle cx="190" cy="350" r="7" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="322" cy="350" r="7" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="256" cy="400" r="9" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Center Focal Point: Dynamic High-Tech Lightning Bolt -->
  <!-- Outer Glow Silhouette -->
  <polygon points="280,68 160,250 248,250 216,444 352,234 266,234" 
           fill="url(#boltGrad)" 
           opacity="0.3" 
           filter="url(#boltGlow)"/>

  <!-- Core Sharp Geometric Bolt -->
  <polygon points="280,72 166,246 250,246 220,436 346,238 268,238" 
           fill="url(#boltGrad)" 
           stroke="#ffffff" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner High-Voltage White Core Highlight -->
  <polygon points="277,88 188,242 254,242 228,400 328,242 267,242" 
           fill="#ffffff" 
           opacity="0.85"/>
</svg>
